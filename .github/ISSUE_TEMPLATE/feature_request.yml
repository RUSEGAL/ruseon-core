name: Feature Request
description: Suggest an idea for RUSEON Core
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: "We welcome feature requests! Please provide as much detail as possible."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what you want.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why is this feature necessary? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
