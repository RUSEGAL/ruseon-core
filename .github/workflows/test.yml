name: Go Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # Можно указать 'stable'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests with Race Detector
        # Запускаем все тесты в проекте и включаем поиск Data Race (состояний гонки)
        run: go test -v -race ./...
