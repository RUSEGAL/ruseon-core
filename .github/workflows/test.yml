name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-checks:
    name: Go Backend (Lint, Security, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Build Frontend for go:embed
        working-directory: ./web
        run: |
          npm install
          npm run build

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@master
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -exclude-dir=pkg/grpc/pb -exclude=G104,G115,G122,G301,G304 ./...

      - name: Run Tests with Race Detector and Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Print Coverage Summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-checks:
    name: React Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run OxLint
        run: npm run lint

      - name: TypeScript Compile Check
        run: npm run build
