name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-checks:
    name: Go Backend (Lint, Security, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: true

      - name: Verify Go Modules
        run: |
          go mod tidy
          git diff --exit-code

      - name: Download Dependencies
        run: go mod download

      - name: Build mock Frontend for go:embed
        run: mkdir -p web/dist && touch web/dist/index.html

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.28.0
        with:
          args: -exclude-dir=pkg/grpc/pb ./...

      - name: Build Backend (Go)
        run: |
          CGO_ENABLED=0 go build -v ./cmd/server
          CGO_ENABLED=0 go build -v ./cmd/ruseon-cli

      - name: Run Tests with Race Detector and Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Performance Validated (Run Benchmarks)
        run: go test -run=^$ -bench="." -benchmem ./...

      - name: Print Coverage Summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-checks:
    name: React Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run OxLint
        run: npm run lint

      - name: TypeScript Compile Check
        run: npm run build
