name: Performance CI/CD (k6)

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build mock Frontend for go:embed
        run: mkdir -p web/dist && touch web/dist/index.html

      - name: Start RUSEON Server in Background
        run: |
          cp config.example.yaml config.yaml
          go build -o server ./cmd/server
          ./server &
          sleep 3 # Wait for server to start

      - name: Run k6 Load Test
        run: docker run --rm --network host -v $(pwd):/app -w /app grafana/k6:latest run tests/performance/k6_load.js

      - name: Stop RUSEON Server
        run: pkill -f server || true
