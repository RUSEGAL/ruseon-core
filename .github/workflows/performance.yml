name: Performance CI/CD (k6)

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  k6-load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build mock Frontend for go:embed
        run: mkdir -p web/dist && touch web/dist/index.html

      - name: Start RUSEON Server in Background
        run: |
          cp config.example.yaml config.yaml
          go build -o server ./cmd/server
          ./server &
          sleep 3 # Wait for server to start

      - name: Run k6 Load Test
        run: docker run --rm --network host --user $(id -u):$(id -g) -v $(pwd):/app -w /app grafana/k6:latest run --summary-export=summary.json tests/performance/k6_load.js

      - name: Stop RUSEON Server
        run: pkill -f server || true

      - name: Parse k6 metrics
        id: metrics
        run: |
          LATENCY_RAW=$(jq '.metrics.http_req_duration["p(95)"] // 0' summary.json)
          SUCCESS_RAW=$(jq '100 - ((.metrics.http_req_failed.value // 0) * 100)' summary.json)
          VUS_RAW=$(jq '.metrics.vus.max // 0' summary.json)
          
          if (( $(echo "$LATENCY_RAW < 1" | bc -l) )); then
            LATENCY="$(echo "$LATENCY_RAW * 1000" | bc | cut -d. -f1)µs"
          else
            LATENCY="$(echo "$LATENCY_RAW" | bc | cut -d. -f1)ms"
          fi
          
          echo "latency=$LATENCY" >> $GITHUB_OUTPUT
          echo "success=${SUCCESS_RAW}%" >> $GITHUB_OUTPUT
          echo "vus=${VUS_RAW}" >> $GITHUB_OUTPUT

      - name: Update Latency Badge
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 9c2397c2c47671c0e65d91e39e91a7a3
          filename: latency-badge.json
          label: "Latency p(95)"
          message: ${{ steps.metrics.outputs.latency }}
          color: "success"

      - name: Update Success Badge
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 9c2397c2c47671c0e65d91e39e91a7a3
          filename: success-badge.json
          label: "Success Rate"
          message: ${{ steps.metrics.outputs.success }}
          color: "success"

      - name: Update VUs Badge
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 9c2397c2c47671c0e65d91e39e91a7a3
          filename: vus-badge.json
          label: "Simultaneous Viewers"
          message: ${{ steps.metrics.outputs.vus }}
          color: "blue"
