server:
  port: 8080
  pprof_port: 6060 # Порт для Continuous Profiling (0 - выключено)
  debug: false
  record_retention_days: 7
  gc_percent: 50
  gc_memory_limit_mb: 2048

auth:
  secret: "" # Leave empty for auto-generation
  # secret: "your-jwt-secret-here" # Секрет генерируется автоматически при первом запуске ruseon-core

global_tags:
  - id: "indoor"
    name: "Внутри помещения"
    color: "#28a745"
  - id: "outdoor"
    name: "На улице"
    color: "#dc3545"

cameras:
  - id: "cam-01"
    url: "rtsp://username:password@192.168.1.100:554/stream1"
    record: true
    retention_days: 14
    tags: ["outdoor"]
    folder_id: "main-building"
    comment: "Парковка"
    transport: "tcp"

