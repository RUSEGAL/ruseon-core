basePath: /
definitions:
  api.CameraInfo:
    properties:
      bytesReceived:
        type: integer
      bytesSent:
        type: integer
      codec:
        type: string
      comment:
        type: string
      connected:
        type: boolean
      disabled:
        type: boolean
      folderId:
        type: string
      frames:
        type: integer
      id:
        type: string
      keyFrames:
        type: integer
      lazyHLS:
        type: boolean
      record:
        type: boolean
      retentionDays:
        type: integer
      tags:
        items:
          type: string
        type: array
      tokenAuth:
        type: boolean
      uptime:
        type: integer
      url:
        type: string
    type: object
  config.CameraConfig:
    properties:
      comment:
        type: string
      disabled:
        description: Disable stream
        type: boolean
      folderId:
        type: string
      id:
        type: string
      lazyHLS:
        type: boolean
      record:
        type: boolean
      retentionDays:
        description: 0 means use global default
        type: integer
      tags:
        items:
          type: string
        type: array
      tokenAuth:
        type: boolean
      transport:
        description: '"tcp", "udp", or "auto"'
        type: string
      url:
        type: string
    type: object
  config.Tag:
    properties:
      id:
        type: string
      color:
        type: string
      name:
        type: string
    type: object
  config.Folder:
    properties:
      id:
        type: string
      name:
        type: string
      parentId:
        type: string
    type: object
host: localhost:8080
info:
  description: REST API for managing RUSEON Core video streaming server.
  title: RUSEON Core API
  version: "1.0"
paths:
  /api/login:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: credentials
        required: true
        schema:
          type: object
          properties:
            username:
              type: string
            password:
              type: string
      responses:
        "200":
          description: OK
          schema:
            type: object
            properties:
              token:
                type: string
      summary: Login to get JWT token
      tags:
      - auth
  /api/cameras:
    get:
      description: Returns a list of all registered cameras along with their real-time statistics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.CameraInfo'
            type: array
      summary: Get all cameras
      tags:
      - cameras
    post:
      consumes:
      - application/json
      description: Dynamically registers a new camera and starts its stream if not disabled
      parameters:
      - description: Camera Configuration
        in: body
        name: camera
        required: true
        schema:
          $ref: '#/definitions/config.CameraConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Add a new camera
      tags:
      - cameras
  /api/cameras/{id}:
    delete:
      description: Stops the stream and completely removes the camera configuration
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Delete a camera
      tags:
      - cameras
    put:
      consumes:
      - application/json
      description: Updates camera settings dynamically without full restart
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Camera Configuration
        in: body
        name: camera
        required: true
        schema:
          $ref: '#/definitions/config.CameraConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Edit a camera
      tags:
      - cameras
  /api/cameras/{id}/archive:
    get:
      description: Retrieve archive recordings for a specific camera in a given time range
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      - description: Start Unix Timestamp (seconds)
        in: query
        name: start
        required: true
        type: integer
      - description: End Unix Timestamp (seconds)
        in: query
        name: end
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Get archive timeline
      tags:
      - archive
  /api/cameras/{id}/export:
    get:
      description: Export an MP4 chunk of the archive
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      - description: Start Unix Timestamp (seconds)
        in: query
        name: start
        required: true
        type: integer
      - description: End Unix Timestamp (seconds)
        in: query
        name: end
        required: true
        type: integer
      produces:
      - video/mp4
      responses:
        "200":
          description: OK
      summary: Export MP4 video
      tags:
      - archive
  /api/stats:
    get:
      description: Get global server statistics
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Server stats
      tags:
      - system
  /system/backup/export:
    get:
      description: Download full configuration backup (BadgerDB) as JSON
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Export Backup
      tags:
      - system
  /system/backup/import:
    post:
      consumes:
      - application/json
      description: Upload full configuration JSON to replace current state
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Import Backup
      tags:
      - system
  /api/tags:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/config.Tag'
            type: array
      summary: Get tags
      tags:
      - tags
    post:
      consumes:
      - application/json
      parameters:
      - in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/config.Tag'
      responses:
        "200":
          description: OK
      summary: Create tag
      tags:
      - tags
  /api/tags/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - in: path
        name: id
        required: true
        type: string
      - in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/config.Tag'
      responses:
        "200":
          description: OK
      summary: Update tag
      tags:
      - tags
    delete:
      parameters:
      - in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
      summary: Delete tag
      tags:
      - tags
  /api/folders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/config.Folder'
            type: array
      summary: Get folders
      tags:
      - folders
    post:
      consumes:
      - application/json
      parameters:
      - in: body
        name: folder
        required: true
        schema:
          $ref: '#/definitions/config.Folder'
      responses:
        "200":
          description: OK
      summary: Create folder
      tags:
      - folders
  /api/folders/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - in: path
        name: id
        required: true
        type: string
      - in: body
        name: folder
        required: true
        schema:
          $ref: '#/definitions/config.Folder'
      responses:
        "200":
          description: OK
      summary: Update folder
      tags:
      - folders
    delete:
      parameters:
      - in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
      summary: Delete folder
      tags:
      - folders
swagger: "2.0"
