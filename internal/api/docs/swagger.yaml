host: localhost:8080
info:
  contact: {}
  description: REST API for managing RUSEON video streaming server.
  title: RUSEON Core API
  version: "1.0"
paths:
  /api/cameras:
    get:
      description: Returns a list of all registered cameras along with their real-time
        statistics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.CameraInfo'
            type: array
      summary: Get all cameras
      tags:
      - cameras
    post:
      consumes:
      - application/json
      description: Dynamically registers a new camera and starts its stream if not
        disabled
      parameters:
      - description: Camera Configuration
        in: body
        name: camera
        required: true
        schema:
          $ref: '#/definitions/config.CameraConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a new camera
      tags:
      - cameras
  /api/cameras/{id}:
    delete:
      description: Stops the stream and completely removes the camera configuration
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a camera
      tags:
      - cameras
    put:
      consumes:
      - application/json
      description: Updates camera settings dynamically without full restart
      parameters:
      - description: Camera ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Camera Configuration
        in: body
        name: camera
        required: true
        schema:
          $ref: '#/definitions/config.CameraConfig'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Edit a camera
      tags:
      - cameras
swagger: "2.0"
