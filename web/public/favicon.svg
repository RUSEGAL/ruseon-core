<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="reaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer ring / Engine -->
  <path 
    d="M50 10 a40 40 0 1 0 0 80 a40 40 0 1 0 0 -80" 
    fill="none" 
    stroke="url(#reaGrad)" 
    stroke-width="6" 
    stroke-dasharray="60 15" 
    stroke-linecap="round" 
  />
  
  <!-- Streams bursting inward from the left -->
  <path d="M10 50 L35 50" fill="none" stroke="url(#reaGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M18 35 Q 28 35 38 42" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />
  <path d="M18 65 Q 28 65 38 58" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />

  <!-- Inner Play -->
  <polygon points="45,30 75,50 45,70" fill="url(#reaGrad)" />
</svg>