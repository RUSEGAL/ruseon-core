version: '3.8'

services:
  ruseon-core:
    build: .
    container_name: ruseon-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ruseon_core_data:/app/data
      - ruseon_core_recordings:/app/recordings
    environment:
      - TZ=UTC

volumes:
  ruseon_core_data:
  ruseon_core_recordings:
